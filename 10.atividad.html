<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="10.atividade.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Game</title>
</head>
<body>

    <header id="hud">
        <div>Pontos: <span id="pontos">0</span></div>
        <div>Vidas: <span id="vidas">3</span></div>
        <div>Fase: <span id="fase">1</span></div>
    </header>

    <main id="container">
        <canvas id="jogo" width="800" height="600"></canvas>
        <div id="mensagem"></div>
    </main>

    <footer>
        <p>Use WASD ou setas para mover | ESPAÇO para atirar | R para reiniciar</p>
    </footer>

    <script src="10.atividade.js"></script>
</body>
</html>
